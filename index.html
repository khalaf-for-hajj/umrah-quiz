<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>مسابقة المعتمرين</title>

<style>
/* ============ المتغيرات (اللون الرئيسي يُضبط من الإعدادات) ============ */
:root{
  --p:#2b7a70; --p-d:#1d5a52; --p-l:#e4f1ee; --p-xl:#f2f8f6;
  --gold:#c8a850; --gold-d:#8f7424; --gold-l:#f8f1dc;
  --bg:#f6f4ee; --card:#fff; --ink:#1c2b29; --muted:#5d6f6b; --line:#e3ded1;
  --ok:#1f8a4c; --ok-l:#e3f4ea; --bad:#c0392b; --bad-l:#fbe9e7; --warn:#b7791f; --warn-l:#fdf3df;
  --r:16px; --sh:0 2px 12px rgba(30,60,55,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:17px;line-height:1.7;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5em;line-height:1.4}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:.4em 0}
a{color:var(--p)}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center} .bold{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .sp{justify-content:space-between}
.mt{margin-top:14px} .mb{margin-bottom:14px} .hide{display:none!important}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* ============ الترويسة بزخرفة هندسية ============ */
.top{position:relative;background:linear-gradient(135deg,var(--p-d),var(--p));color:#fff;padding:12px 16px;border-bottom:4px solid var(--gold);overflow:hidden}
.top::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.08) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,rgba(255,255,255,.08) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.08) 75%);
  background-size:30px 30px;background-position:0 0,0 15px,15px -15px,-15px 0}
.top .in{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;max-width:1100px;margin:0 auto}
.top .grow{min-width:150px}
.top img{width:48px;height:48px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
.top .name{font-weight:800;font-size:1.2rem;line-height:1.3}
.top .sub{font-size:.8rem;opacity:.85}
.star{display:inline-block;position:relative;width:14px;height:14px;margin:0 6px;vertical-align:middle}
.star::before,.star::after{content:"";position:absolute;inset:0;border:2px solid var(--gold);transform:rotate(0)}
.star::after{transform:rotate(45deg)}
.orn{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--gold-d);margin:10px 0}
.orn::before,.orn::after{content:"";height:2px;flex:1;max-width:80px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}

/* ============ الصفحات والبطاقات ============ */
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.wide{max-width:1100px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card.gold{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-l),#fff 60%)}
.hero{text-align:center;padding:22px 16px}
.hero img{width:150px;height:150px;object-fit:contain;margin:0 auto 6px;display:block}

/* ============ الأزرار والحقول ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .08s,opacity .2s,background .2s;text-decoration:none}
.btn:active{transform:scale(.97)} .btn:hover{background:var(--p-d)}
.btn.block{display:flex;width:100%}
.btn.gold{background:var(--gold);color:#3a2e07} .btn.gold:hover{background:#b8982f}
.btn.ghost{background:#fff;color:var(--p);border:2px solid var(--p)} .btn.ghost:hover{background:var(--p-l)}
.btn.danger{background:var(--bad)} .btn.danger:hover{background:#9e2e22}
.btn.sm{min-height:38px;padding:4px 14px;font-size:.92rem;border-radius:10px}
.btn[disabled],.btn.busy{opacity:.55;pointer-events:none}
.btn.busy::after{content:"";width:16px;height:16px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{margin-bottom:14px} .field>label{display:block;font-weight:700;margin-bottom:4px;font-size:.95rem}
.input,select.input,textarea.input{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:1.1rem;outline:0;transition:border .15s}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-l)}
.input.ltr{direction:ltr;text-align:left}
.hint{font-size:.85rem;color:var(--muted);margin-top:3px}
.seg{display:flex;gap:8px} .seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:52px;border:2px solid var(--line);border-radius:12px;font-weight:700;cursor:pointer;background:#fff}
.seg input:checked+span{border-color:var(--p);background:var(--p-l);color:var(--p-d)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--p)}
.alert{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:.97rem;border:1px solid transparent}
.alert.err{background:var(--bad-l);color:#7d2218;border-color:#f1c3bd} .alert.ok{background:var(--ok-l);color:#14552f;border-color:#bfe3cd}
.alert.warn{background:var(--warn-l);color:#6b4710;border-color:#f0d9a6} .alert.info{background:var(--p-l);color:var(--p-d);border-color:#c5e0da}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.82rem;font-weight:700;background:var(--p-l);color:var(--p-d)}
.chip.gold{background:var(--gold-l);color:var(--gold-d)} .chip.bad{background:var(--bad-l);color:var(--bad)} .chip.ok{background:var(--ok-l);color:var(--ok)} .chip.gray{background:#eceae3;color:var(--muted)}
.demo-bar{background:#fff3cd;color:#664d03;text-align:center;font-size:.85rem;padding:6px 10px;border-bottom:1px solid #ecd791}
.test-bar{background:#fde2dd;color:#7d2218;text-align:center;font-size:.85rem;padding:6px 10px;border-bottom:1px solid #f1c3bd;font-weight:700}

/* ============ شاشة السؤال ============ */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;color:var(--p-d)}
.bar{flex:1;height:8px;background:#e6e2d6;border-radius:9px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width .4s}
.timer{margin:6px 0 16px}
.timer .bar{height:14px;background:#e6e2d6} .timer .bar>i{background:linear-gradient(90deg,var(--gold),var(--p));transition:width .15s linear}
.timer.low .bar>i{background:var(--bad)} .timer .secs{font-size:1.5rem;font-weight:800;color:var(--p-d);min-width:2.2em;text-align:center}
.timer.low .secs{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.qcat{margin-bottom:6px}
.qtext{font-size:1.4rem;font-weight:800;line-height:1.8;margin:6px 0 18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;min-height:60px;padding:14px 16px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:1.15rem;font-weight:500;cursor:pointer;transition:transform .08s,border .15s,background .15s}
.opt:active{transform:scale(.98)} .opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--p-l);color:var(--p-d);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.opt.sel{border-color:var(--p);background:var(--p-l)} .opt.sel .k{background:var(--p);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-l)} .opt.bad .k{background:var(--bad);color:#fff}
.opts.locked .opt{pointer-events:none} .opts.locked .opt:not(.sel):not(.ok):not(.bad){opacity:.55}
.ack{text-align:center;padding:26px 10px;font-size:1.2rem;font-weight:800;color:var(--ok)}
.ack .tick{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--ok);color:#fff;font-size:2rem;animation:pop .35s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.getready{text-align:center;padding:30px 0;font-size:1.3rem;font-weight:800;color:var(--p-d)}
.netwarn{position:sticky;top:0;z-index:5;background:var(--warn-l);color:#6b4710;text-align:center;padding:8px;font-weight:700;border-bottom:1px solid #f0d9a6}

/* ============ النتائج والمتصدرون ============ */
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat>div{background:var(--p-xl);border-radius:12px;padding:10px 4px;border:1px solid var(--line)}
.bigstat b{display:block;font-size:1.7rem;color:var(--p-d);line-height:1.2} .bigstat span{font-size:.82rem;color:var(--muted)}
.lb{list-style:none;margin:0;padding:0} .lb li{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)}
.lb li.me{background:var(--gold-l);border-radius:10px;border:2px solid var(--gold);font-weight:800}
.lb .rk{flex:none;width:36px;height:36px;border-radius:50%;background:var(--p-l);display:grid;place-items:center;font-weight:800;color:var(--p-d)}
.lb li:nth-child(1) .rk{background:var(--gold);color:#3a2e07} .lb .pt{font-weight:800;color:var(--p-d)}
.rev{border-right:5px solid var(--line);padding:8px 12px;margin-bottom:10px;background:#fff;border-radius:10px}
.rev.ok{border-color:var(--ok)} .rev.bad{border-color:var(--bad)}
.rev .a{font-size:.95rem} .rev .e{font-size:.9rem;color:var(--muted);background:var(--p-xl);border-radius:8px;padding:6px 10px;margin-top:6px}

/* ============ لوحة المشرف ============ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch}
.tabs a{flex:none;padding:8px 16px;border-radius:99px;text-decoration:none;font-weight:700;color:var(--muted);background:#f0eee6}
.tabs a.on{background:var(--p);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:2rem;color:var(--p-d);line-height:1.2} .stat span{font-size:.85rem;color:var(--muted)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:.95rem;min-width:560px}
.tbl th{background:var(--p-l);color:var(--p-d);text-align:right;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle} .tbl tr:hover td{background:var(--p-xl)}
.tbl td.act{white-space:nowrap;text-align:left}
.pbar{height:10px;border-radius:9px;background:#e6e2d6;overflow:hidden;min-width:80px} .pbar>i{display:block;height:100%;background:var(--p)} .pbar.low>i{background:var(--bad)} .pbar.mid>i{background:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-height:42px;font-size:1rem;padding:6px 12px}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.qcard.off{opacity:.6;background:#f3f1ea}
.qcard ol{margin:6px 0 0;padding-inline-start:22px} .qcard li.right{color:var(--ok);font-weight:800}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:8px} .optrow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.stepper{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap} .stepper span{padding:4px 12px;border-radius:99px;background:#eceae3;color:var(--muted);font-weight:700;font-size:.9rem} .stepper span.on{background:var(--p);color:#fff}
.qrbox{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--line);width:210px;height:210px;margin:0 auto} .qrbox svg{width:100%;height:100%}
.linkbox{direction:ltr;text-align:left;background:var(--p-xl);border:1px dashed var(--p);border-radius:10px;padding:8px 10px;word-break:break-all;font-size:.9rem}
.statelabel{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:99px;font-weight:800}
.statelabel::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.st-draft{background:#eceae3;color:var(--muted)} .st-scheduled{background:var(--warn-l);color:var(--warn)} .st-open{background:var(--ok-l);color:var(--ok)} .st-closed{background:var(--bad-l);color:var(--bad)} .st-published{background:var(--gold-l);color:var(--gold-d)}

/* ============ النوافذ والإشعارات ============ */
.ov{position:fixed;inset:0;background:rgba(15,35,32,.55);display:grid;place-items:center;padding:16px;z-index:100;animation:fade .15s}
.dlg{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg.big{max-width:760px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;bottom:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 14px}
.toast{background:#1c2b29;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);animation:fade .2s;max-width:420px;text-align:center}
.toast.err{background:var(--bad)} .toast.ok{background:var(--ok)}
.loading{display:grid;place-items:center;padding:50px 0;color:var(--muted)} .loading::before{content:"";width:34px;height:34px;border:4px solid var(--p-l);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}

/* ============ إعلان الفائزين (ملء الشاشة) ============ */
.win{position:fixed;inset:0;z-index:150;overflow:auto;color:#fff;text-align:center;padding:20px 14px 40px;
  background:radial-gradient(circle at 50% 0%,#2f8a7e 0%,var(--p-d) 55%,#10332e 100%)}
.win::before{content:"";position:fixed;inset:0;opacity:.18;pointer-events:none;
  background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);
  background-size:44px 44px;background-position:0 0,0 22px,22px -22px,-22px 0}
.win>*{position:relative}
.win h1{font-size:2.4rem;color:var(--gold);margin:6px 0 2px} .win .cn{opacity:.9;margin-bottom:10px}
.win .x{position:fixed;top:12px;left:12px;z-index:3;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;max-width:760px;margin:26px auto 10px;direction:ltr}
.podium .slot{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;direction:rtl}
.podium .who{opacity:0;animation:fade .6s forwards;margin-bottom:8px;padding:0 4px;word-break:break-word}
.podium .who b{display:block;font-size:1.35rem;line-height:1.4} .podium .who span{font-size:.95rem;opacity:.9}
.podium .blk{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:2.6rem;font-weight:800;transform-origin:bottom;transform:scaleY(0);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;color:#3a2e07}
.podium .s1 .blk{height:230px;background:linear-gradient(180deg,#f1d77a,var(--gold));animation-delay:1.6s} .podium .s1 .who{animation-delay:2.4s}
.podium .s2 .blk{height:170px;background:linear-gradient(180deg,#e9edf0,#aab4bb);animation-delay:.8s} .podium .s2 .who{animation-delay:1.6s}
.podium .s3 .blk{height:120px;background:linear-gradient(180deg,#e0b48a,#b27a49);animation-delay:0s} .podium .s3 .who{animation-delay:.9s}
@keyframes rise{to{transform:scaleY(1)}}
.win .grp{margin-top:26px} .win .grp h2{color:var(--gold);font-size:1.6rem}

/* ============ الطباعة ============ */
@media print{
  body{background:#fff;font-size:12px} .noprint,.tabs,.top,.demo-bar,.test-bar,#toasts{display:none!important}
  .wrap{max-width:none;padding:0} .card{box-shadow:none;border:0;padding:0} .tblw{border:0;overflow:visible} table.tbl{min-width:0}
  .tbl th{position:static}
}
.hide-screen{display:none} @media print{.hide-screen{display:block;margin-bottom:8px}}
@media (min-width:700px){ body{font-size:18px} .opts.two{grid-template-columns:1fr 1fr} }
</style>

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹';
const toLatinDigits = s => String(s ?? '').replace(/[٠-٩۰-۹]/g, c => String(AR_DIGITS.indexOf(c) % 10));

// نفس قواعد دالة normalize_phone في قاعدة البيانات تماماً (الخادم هو المرجع)
function normalizePhone(raw) {
  const s = toLatinDigits(raw);
  let d = s.replace(/[^0-9]/g, '');
  if (!d) return null;
  let intl = false;
  if (/^[^0-9]*\+/.test(s)) intl = true;
  else if (d.startsWith('00')) { intl = true; d = d.slice(2); }
  if (intl) {
    if (d.startsWith('9660')) d = '966' + d.slice(4);
    if (d.startsWith('966')) return /^9665[0-9]{8}$/.test(d) ? '+' + d : null;
    return /^[1-9][0-9]{7,14}$/.test(d) ? '+' + d : null;
  }
  if (/^05[0-9]{8}$/.test(d)) return '+966' + d.slice(1);
  if (/^5[0-9]{8}$/.test(d)) return '+966' + d;
  if (/^9665[0-9]{8}$/.test(d)) return '+' + d;
  if (/^[1-9][0-9]{10,14}$/.test(d)) return '+' + d;
  return null;
}

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let hh = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60;
  }
  return [hh, s * 100, l * 100];
}
const hsl = (h2, s, l) => `hsl(${h2.toFixed(0)} ${s.toFixed(0)}% ${clamp(l, 0, 100).toFixed(0)}%)`;
function applyTheme(cfg) {
  const root = document.documentElement.style;
  const c = /^#[0-9a-f]{6}$/i.test(cfg.primary_color) ? cfg.primary_color : '#2b7a70';
  const [hh, s, l] = hexToHsl(c);
  root.setProperty('--p', c);
  root.setProperty('--p-d', hsl(hh, s, Math.min(l, 45) * .72));
  root.setProperty('--p-l', hsl(hh, Math.min(s, 40), 93));
  root.setProperty('--p-xl', hsl(hh, Math.min(s, 35), 96.5));
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = hsl(hh, s, Math.min(l, 45) * .72);
  document.title = `${cfg.campaign_name} — مسابقة المعتمرين`;
}

function toast(msg, kind = '') {
  const box = $('#toasts');
  [...box.children].forEach(x => { if (x.textContent === msg) x.remove(); });          // لا نكرر نفس الرسالة
  while (box.children.length >= 3) box.firstChild.remove();                              // حد أقصى 3 رسائل ظاهرة
  const t = h('div', { class: 'toast ' + kind }, msg);
  box.append(t); setTimeout(() => t.remove(), kind === 'err' ? 5000 : 3000);
}
function modal(content, { big = false, dismiss = true } = {}) {
  const ov = h('div', { class: 'ov' });
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape' && dismiss) close(); };
  ov.append(h('div', { class: 'dlg' + (big ? ' big' : '') }, content));
  if (dismiss) ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', esc); document.body.append(ov);
  return { close, el: ov };
}

/* ============================ طبقة الاتصال (Supabase أو محلي) ============================ */
class ApiError extends Error { constructor(m, code) { super(m); this.code = code; } }
let backend = null, sb = null;

async function initBackend() {
  if (DEMO) { backend = createLocalBackend(); return; }
  const { createClient } = await import(CDN.supabase);
  sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  backend = { rpc: (n, p) => sb.rpc(n, p) };
}
async function rpc(name, params = {}) {
  let res;
  try { res = await backend.rpc(name, params); }
  catch { throw new ApiError('تعذّر الاتصال بالخادم. تحقق من الإنترنت', 'network'); }
  const { data, error } = res;
  if (error) {
    const m = String(error.message || '');
    if (!navigator.onLine || /failed to fetch|networkerror|load failed|network request|timeout|abort|fetch/i.test(m) && !/[؀-ۿ]/.test(m))
      throw new ApiError('انقطع الاتصال بالإنترنت', 'network');
    if (error.code === '42501' || /permission denied|jwt/i.test(m)) throw new ApiError('غير مصرّح لك بهذه العملية. سجّل الدخول كمشرف', 'auth');
    throw new ApiError(/[؀-ۿ]/.test(m) ? m : 'حدث خطأ غير متوقع، حاول مرة أخرى', 'rpc');
  }
  return data;
}
// إعادة المحاولة عند انقطاع الشبكة فقط (لا تُعاد أخطاء الخادم). shouldContinue تُوقف الحلقة.
async function rpcRetry(name, params, { onRetry, shouldContinue = () => true } = {}) {
  for (let i = 0; ; i++) {
    try { return await rpc(name, params); }
    catch (e) {
      if (e.code !== 'network' || !shouldContinue()) throw e;
      onRetry?.(i + 1);
      await sleep(Math.min(1000 + i * 700, 4000));
    }
  }
}

function countdown(node, iso, onDone) {
  const t = Date.parse(iso); let id;
  const tick = () => {
    const s = Math.max(0, Math.ceil((t - serverNow()) / 1000));
    const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    node.textContent = (d ? `${d} يوم ` : '') + [hh, m, ss].map(x => String(x).padStart(2, '0')).join(':');
    if (s <= 0) { clearInterval(id); onDone?.(); }
  };
  tick(); id = setInterval(tick, 1000); return () => clearInterval(id);
}

    if (Q && hasReal(Q.id) && (Q.options.length !== opts.length || opts.some(o => !o.id || !Q.options.some(x => x.id === o.id)))) fail('لا يمكن إضافة أو حذف اختيارات بعد بدء المسابقة');

          if (bt) { let b = db.buses.find(x => x.name.toLowerCase() === bt.toLowerCase()); if (!b) { b = { id: db.nextBus++, name: bt.slice(0, 40) }; db.buses.push(b); buses_created++; } bus = b.id; }
          const ex = byPhone(ph);
          if (!ex) { db.participants.push({ id: uid(), phone: ph, name, gender: g, bus_id: bus, source: 'import', is_test: false, created_at: Date.now() }); inserted++; }
          else if (p_mode === 'update') { Object.assign(ex, { name, gender: g, bus_id: bus }); updated++; } else skipped++;
        } catch (e) { errors.push({ row: r._row ?? i + 1, message: e.message }); }
      });
      return { ok: true, inserted, updated, skipped, buses_created, errors };
    },
    admin_results() {
      sweep();
      return ranking(true).map(r => ({ participant_id: r.participant_id, rank: r.rnk, name: r.name, phone: r.phone, gender: r.gender, bus_id: r.bus_id, bus_name: r.bus_name,
        points: r.points, correct: r.correct_count, total_ms: r.total_ms, status: r.status, finished_at: iso(r.finished_at), resumes: r.resume_count, is_test: r.is_test }));
    },
    admin_delete_test_data() {
      const a = db.attempts.filter(x => x.is_test).length, p = db.participants.filter(x => x.is_test).length;
      const gone = new Set(db.participants.filter(x => x.is_test).map(x => x.id));
      db.attempts = db.attempts.filter(x => !x.is_test && !gone.has(x.participant_id)); db.participants = db.participants.filter(x => !x.is_test);
      return { ok: true, attempts: a, participants: p };
    },
    admin_reset_test_attempt({ p_participant_id }) { const n = db.attempts.length; db.attempts = db.attempts.filter(a => !(a.participant_id === p_participant_id && a.is_test)); return { ok: true, deleted: n - db.attempts.length }; },
    admin_regrade() {
      let n = 0;
      db.attempts.forEach(a => {
        a.qs.forEach(q => {
          if (q.status !== 'answered') return; const Q = db.questions.find(x => x.id === q.question_id); n++;
          q.is_correct = !!q.chosen && q.chosen === Q?.correct_option_id;
          q.points = q.is_correct ? q.base + Math.round(q.bonus * Math.max(0, 1 - (q.elapsed_ms ?? q.seconds * 1000) / (q.seconds * 1000))) : 0;
        }); recalc(a);
      });
      return { ok: true, regraded: n };
    },
  };
  // أي استدعاء يمر عبر هنا: يحاكي زمن الشبكة ويحفظ الحالة
  return {
    async rpc(name, params = {}) {
      await sleep(25);
      try {
        if (!H[name]) throw new Error('دالة غير معروفة: ' + name);
        const data = H[name](params); save(); return { data: JSON.parse(JSON.stringify(data)), error: null };
      } catch (e) { save(); return { data: null, error: { message: e.message } }; }
    },
    reset() { db = seed(); save(); },
  };
}

/* ---------------------------- تأكيد البيانات ---------------------------- */

  if (info.attempt === 'finished') action = [alertEl('ok', 'لقد شاركت في المسابقة مسبقاً. شكراً لك!'), btnAct('عرض حالة مشاركتي', '', wrapFail(showFinishedStatus))];
  else if (info.attempt === 'in_progress') action = [alertEl('warn', 'لديك مشاركة قيد التنفيذ.'), rules, btnAct('تابع المسابقة', 'gold block', wrapFail(startQuiz))];
  else if (info.can_play) action = [rules, btnAct('نعم، هذه بياناتي — ابدأ المسابقة', 'gold block', wrapFail(startQuiz))];

    : alertEl('warn', info.state === 'published' ? 'لم تشارك في هذه المسابقة.' : 'انتهت المسابقة.')];

async function showFinishedStatus() {
  const r = await rpc('get_my_result', { p_phone: P.phone, p_token: tokenFor(P.phone) });
  if (r.status === 'published') return showResults();
  showDone({ show_score: r.points != null, points: r.points });
}

/* ---------------------------- المسابقة ---------------------------- */
async function startQuiz() {
  const r = await rpcRetry('start_attempt', { p_phone: P.phone, p_token: tokenFor(P.phone) });
  if (!r.ok) {
    if (['not_open', 'not_started', 'closed'].includes(r.error)) { await loadConfig(); toast(r.message, 'err'); return showLogin(phoneShow(P.phone)); }
    return toast(r.message, 'err');
  }
  if (r.status === 'finished') return showDone(r.summary);
  P.token = r.token || tokenFor(P.phone);
  store.set(SESS, { phone: P.phone, token: P.token });
  runQuestion(r.question);
}

function runQuestion(q, autoToken = null) {
  const now0 = performance.now(), startAt = now0 + q.starts_in_ms, deadline = now0 + q.remaining_ms, total = q.seconds * 1000;
  let locked = false, shown = false, timer = null;
  const secs = h('div', { class: 'secs num' }), fill = h('i');
  const timerEl = h('div', { class: 'timer row' }, h('div', { class: 'bar grow' }, fill), secs);
  const net = h('div', { class: 'netwarn hide' }, 'انقطع الاتصال… نعيد المحاولة تلقائياً ولن تضيع إجابتك');
  const opts = h('div', { class: 'opts' + (q.options.length > 3 ? ' two' : '') });
  const box = h('div', null, h('div', { class: 'getready' }, 'استعد… السؤال التالي بعد لحظات'));

  const setLocked = v => { locked = v; opts.classList.toggle('locked', v); };
  async function submit(token, btn) {
    setLocked(true); clearInterval(timer);
    store.set(PEND, { idx: q.idx, token, phone: P.phone });
    let r;
    try { r = await rpcRetry('submit_answer', { p_phone: P.phone, p_token: P.token, p_idx: q.idx, p_option: token }, { onRetry: () => net.classList.remove('hide') }); }
    catch (e) { net.classList.add('hide'); toast(errMsg(e), 'err'); btn?.classList.remove('sel'); setLocked(false); startTimer(); return; }
    net.classList.add('hide'); store.del(PEND);
    if (!r.ok) { return r.error === 'bad_token' ? lostSession() : resync(); }
    if (token == null) toast('انتهى وقت السؤال', 'err');
    else if (r.late) toast('وصلت إجابتك بعد انتهاء الوقت ولم تُحتسب', 'err');
    else if (!r.duplicate) toast('✓ تم تسجيل إجابتك', 'ok');
    if (r.feedback) {                       // الصح/الخطأ يظهر فقط إذا فعّله المشرف
      btn?.classList.add(r.feedback.correct ? 'ok' : 'bad');
      $$('.opt', opts).forEach(b => { if (b.dataset.t === r.feedback.correct_token) b.classList.add('ok'); });
      await sleep(1700);
    }
    if (r.status === 'finished') return showDone(r.summary);
    runQuestion(r.question);
  }
  q.options.forEach((o, i) => opts.append(h('button', { class: 'opt', 'data-t': o.token, onclick: e => { if (!locked && shown) { e.currentTarget.classList.add('sel'); submit(o.token, e.currentTarget); } } },
    h('span', { class: 'k' }, LETTERS[i]), h('span', { class: 'grow' }, o.text))));

  function tick() {
    const t = performance.now();
    if (!shown && t >= startAt) { shown = true; mount(box, opts); if (autoToken) { const b = $$('.opt', opts).find(x => x.dataset.t === autoToken); if (b) { b.classList.add('sel'); submit(autoToken, b); return; } } }
    const left = Math.max(0, deadline - Math.max(t, startAt));
    fill.style.width = (shown ? left / total * 100 : 100) + '%';
    secs.textContent = Math.ceil(left / 1000);
    timerEl.classList.toggle('low', left <= 5000);
    if (shown && !locked && t >= deadline) submit(null, null);       // انتهى الوقت: تسجيل بلا إجابة
  }
  function startTimer() { clearInterval(timer); timer = setInterval(tick, 100); }
  async function resync() {
    try {
      const r = await rpc('get_current_question', { p_phone: P.phone, p_token: P.token });
      if (!r.ok) return lostSession();
      r.status === 'finished' ? showDone(r.summary) : runQuestion(r.question);
    } catch (e) { toast(errMsg(e), 'err'); }
  }

  screen(net, h('div', { class: 'prog' }, h('span', null, `السؤال ${q.idx + 1} من ${q.total}`), h('div', { class: 'bar' }, h('i', { style: { width: (q.idx / q.total * 100) + '%' } }))), timerEl,
    h('div', { class: 'card' }, h('div', { class: 'qcat' }, h('span', { class: 'chip gold' }, CATS[q.category] || '')), h('div', { class: 'qtext' }, q.text), box));
  tick(); startTimer();
  onLeave(() => clearInterval(timer));
  // عند عودة المتصفح للواجهة (بعد قفل الشاشة مثلاً) نزامن العدّاد مع الخادم
  P.resync = () => { if (!locked) resync(); };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && P.resync) P.resync(); });

function lostSession() {
  const s = store.get(SESS); if (s) store.set(SESS, { phone: s.phone, token: null });
  screen(h('div', { class: 'card center' }, h('h2', null, 'انتهت جلستك'), alertEl('warn', 'أدخل رقم جوالك مرة أخرى للمتابعة من حيث توقفت.'),

const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;

    mount(list, rows.length ? h('ul', { class: 'lb' }, rows) : h('p', { class: 'muted center' }, 'لا توجد نتائج في هذه الفئة'), meOut);
  };
  const load = wrapFail(async g => drawLb(await rpcRetry('get_leaderboard', { p_phone: P.phone, p_gender: g })));
  [['', 'الكل'], ['M', 'رجال'], ['F', 'نساء']].forEach(([g, l], i) => seg.append(h('label', null, h('input', { type: 'radio', name: 'lbg', checked: i === 0, onchange: () => load(g || null) }), h('span', null, l))));
  drawLb(lb);

  const reviewBox = h('div', { class: 'hide' }, me.review.map(r => h('div', { class: 'rev ' + (r.is_correct ? 'ok' : 'bad') },
    h('div', { class: 'bold' }, `${r.n}. ${r.text}`),
    h('div', { class: 'a' }, 'إجابتك: ', h('b', null, r.chosen_text || (r.status === 'timeout' ? 'لم تُجب (انتهى الوقت)' : '—')), r.is_correct ? ' ✅' : ' ❌'),
    r.is_correct ? null : h('div', { class: 'a' }, 'الصحيحة: ', h('b', { style: { color: 'var(--ok)' } }, r.correct_text)),
    r.explanation ? h('div', { class: 'e' }, r.explanation) : null, h('div', { class: 'small muted' }, `+${r.points} نقطة`))));
  const lbBox = h('div', null, h('h3', null, 'المتصدرون'), seg, list);
  const tabBtn = (txt, on) => h('button', { class: 'btn sm ' + (on ? '' : 'ghost'), onclick: e => { const rev = txt.includes('مراجعة'); reviewBox.classList.toggle('hide', !rev); lbBox.classList.toggle('hide', rev); $$('.tabsw button').forEach(b => b.classList.add('ghost')); e.currentTarget.classList.remove('ghost'); } }, txt);

  screen(

async function bootParticipant() {
  const sess = store.get(SESS);
  if (sess?.phone && sess.token) {
    P.phone = sess.phone; P.token = sess.token;
    screen(loadingEl('جارٍ استعادة مشاركتك…'));
    try {
      const r = await rpcRetry('get_current_question', { p_phone: P.phone, p_token: P.token }, { shouldContinue: () => !location.hash.startsWith('#/admin') });
      if (r.ok && r.status === 'in_progress') {
        const pend = store.get(PEND);       // إجابة لم تصل قبل انقطاع الإنترنت: تُرسل الآن
        return runQuestion(r.question, pend && pend.phone === P.phone && pend.idx === r.question.idx && r.question.remaining_ms > 0 ? pend.token : null);
      }
      if (r.ok && r.status === 'finished') return CFG.state === 'published' ? showResults() : showDone(r.summary);
      if (!r.ok) store.set(SESS, { phone: sess.phone, token: null });
    } catch (e) { return screen(h('div', { class: 'card center' }, alertEl('err', errMsg(e)), h('button', { class: 'btn', onclick: bootParticipant }, 'إعادة المحاولة'))); }
  }
  showLogin(sess?.phone ? phoneShow(sess.phone) : '');
}

// ضغط الشعار في المتصفح إلى ≤ 200KB (data URL)
async function compressLogo(file) {
  if (!file.type.startsWith('image/')) throw new Error('اختر ملف صورة');
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('تعذّر قراءة الصورة')); i.src = URL.createObjectURL(file); });
  for (const max of [320, 256, 192, 128]) {
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = h('canvas', { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    for (const [type, q] of [['image/webp', .9], ['image/png'], ['image/jpeg', .85]]) {
      const url = c.toDataURL(type, q);
      if (url.startsWith('data:' + type) && url.length <= 273100) { URL.revokeObjectURL(img.src); return url; }
    }
  }
  throw new Error('تعذّر ضغط الشعار إلى أقل من 200KB، جرّب صورة أبسط');
}

   الأسئلة
   ===================================================================== */
const CAT_AR = { 'فقهي': 'fiqh', 'فقه': 'fiqh', 'fiqh': 'fiqh', 'ثقافي': 'culture', 'ثقافة': 'culture', 'culture': 'culture', 'أخرى': 'other', 'اخرى': 'other', 'other': 'other' };
const LET_IDX = { 'أ': 0, 'ا': 0, 'a': 0, 'ب': 1, 'b': 1, 'ج': 2, 'c': 2, 'د': 3, 'd': 3, 'ه': 4, 'هـ': 4, 'e': 4, 'و': 5, 'f': 5 };

// تحديد فهرس الإجابة الصحيحة من (رقم / حرف / نص الاختيار)
function resolveCorrect(spec, opts) {
  const s = toLatinDigits(spec).trim(); if (!s) return -1;
  if (/^\d$/.test(s) && +s >= 1 && +s <= opts.length) return +s - 1;
  const l = s.toLowerCase().replace(/[\s.)\-:]/g, '');
  if (l in LET_IDX && LET_IDX[l] < opts.length) return LET_IDX[l];
  return opts.findIndex(o => o.trim() === s);
}
function checkQ(q) {
  if ((q.text || '').trim().length < 3) return 'نص السؤال ناقص';
  if (q.options.length < 2) return 'يلزم اختياران على الأقل';
  if (q.options.length > 6) return 'الحد الأقصى 6 اختيارات';
  if (new Set(q.options.map(o => o.trim().toLowerCase())).size !== q.options.length) return 'اختيارات مكررة';
  if (q.correct_index < 0) return 'الإجابة الصحيحة غير محددة أو لا تطابق أي اختيار';
  return '';
}
function questionsFromTable(aoa) {
  const hdr = aoa[0].map(normHdr), iq = hdrFind(hdr, 'سؤال', 'question');
  if (iq < 0) throw new Error('الصف الأول يجب أن يحتوي عناوين الأعمدة (السؤال، الاختيار 1، ...، الإجابة الصحيحة). حمّل النموذج للمساعدة.');
  const iAns = hdrFind(hdr, 'صحيح', 'correct', 'answer'), iCat = hdrFind(hdr, 'تصنيف', 'category', 'نوع'), iExp = hdrFind(hdr, 'شرح', 'explanation', 'توضيح'),
    iPts = hdrFind(hdr, 'نقاط', 'points'), iSec = hdrFind(hdr, 'وقت', 'ثوان', 'seconds', 'time');
  const optCols = hdr.map((c, i) => (/^(اختيار|خيار|option|choice)/.test(c) || /^[a-f]$/.test(c) || ['ا', 'ب', 'ج', 'د', 'ه', 'و'].includes(c)) && i !== iAns ? i : -1).filter(i => i >= 0);
  return aoa.slice(1).map((r, n) => {
    const options = optCols.map(i => r[i]).filter(x => x !== '' && x != null);
    return mkQ(n + 2, r[iq], CAT_AR[normHdr(r[iCat] || '')] || 'fiqh', options, iAns >= 0 ? r[iAns] : '', iExp >= 0 ? r[iExp] : '', iPts >= 0 ? r[iPts] : '', iSec >= 0 ? r[iSec] : '');
  }).filter(q => q.text || q.options.length);
}
function mkQ(row, text, category, options, ans, explanation, points, seconds) {
  const q = { _row: row, text: String(text || '').trim(), category, options: options.map(o => String(o).trim()), explanation: String(explanation || '').trim(),
    points: points === '' ? null : (+toLatinDigits(points) || null), seconds: seconds === '' ? null : (+toLatinDigits(seconds) || null) };
  q.correct_index = resolveCorrect(ans, q.options); q.error = checkQ(q); return q;
}
// لصق نصي: كتل مفصولة بسطر فارغ. السطر الأول سؤال، ثم اختيارات (أ) ب) ... أو - ...)، والصحيح بعلامة * أو سطر «الإجابة: ب»
function questionsFromText(txt) {
  return toLatinDigits(txt).replace(/\r/g, '').split(/\n\s*\n/).map(b => b.split('\n').map(l => l.trim()).filter(Boolean)).filter(b => b.length).map((lines, n) => {
    let text = lines[0].replace(/^\d+\s*[.)\-–]\s*/, ''), cat = 'fiqh', ans = '', exp = ''; const opts = []; let star = -1;
    lines.slice(1).forEach(l => {
      let m;
      if ((m = l.match(/^(?:الإجابة|الاجابة|الصحيح|answer)[^:：]*[:：]\s*(.+)$/i))) ans = m[1];
      else if ((m = l.match(/^(?:الشرح|التوضيح|explanation)\s*[:：]\s*(.+)$/i))) exp = m[1];
      else if ((m = l.match(/^(?:التصنيف|category)\s*[:：]\s*(.+)$/i))) cat = CAT_AR[normHdr(m[1])] || 'fiqh';
      else {
        const o = l.match(/^(?:[*✓✔]\s*)?(?:[أابجدهـوa-f]|\d)\s*[).\-–:]\s*(.+)$/i) || l.match(/^(?:[*✓✔]\s*)?[-•*]\s*(.+)$/);
        if (o) { let t = o[1].trim(); const marked = /^[*✓✔]/.test(l) || /[*✓✔]$/.test(t) || /\((?:صح|صحيح)\)$/.test(t); t = t.replace(/\s*(?:[*✓✔]|\((?:صح|صحيح)\))$/, '').trim(); if (marked) star = opts.length; opts.push(t); }
        else if (!opts.length) text += ' ' + l;
      }
    });
    const q = mkQ(n + 1, text, cat, opts, ans, exp, '', ''); if (star >= 0 && q.correct_index < 0) { q.correct_index = star; q.error = checkQ(q); } return q;
  });
}

  /* ---- استيراد المشتركين مع معاينة وكشف الأخطاء والتكرار ---- */

        tbl(['صف', 'الاسم', 'الجوال', 'الجنس', 'الباص', 'الحالة'], rows.slice(0, 300).map(r => h('tr', null, h('td', { class: 'num' }, r._row), h('td', null, r.name), h('td', { class: 'num' }, r.phoneN ? phoneShow(r.phoneN) : r.phone), h('td', null, genderLabel(r.g) || r.gRaw), h('td', null, r.bus ? busLabel(r.bus) : '—'),

        h('div', { class: 'row mt' }, btnAct(`حفظ ${good.length} مشترك`, '', async () => {
          if (!good.length) return toast('لا توجد صفوف صالحة', 'err');
          const tot = { inserted: 0, updated: 0, skipped: 0, buses_created: 0, errors: [] };
          try {
            for (let i = 0; i < good.length; i += 200) {
              const r = await rpcRetry('admin_import_participants', { p_rows: good.slice(i, i + 200).map(x => ({ _row: x._row, name: x.name, phone: x.phone, gender: x.gRaw, bus: x.bus })), p_mode: mode });
              ['inserted', 'updated', 'skipped', 'buses_created'].forEach(k => { tot[k] += r[k]; }); tot.errors.push(...r.errors);
            }
          } catch (e) { return toast(errMsg(e), 'err'); }
          m.close(); await reload();
          toast(`أُضيف ${tot.inserted} · حُدّث ${tot.updated} · تُخطي ${tot.skipped}${tot.buses_created ? ` · باصات جديدة ${tot.buses_created}` : ''}${tot.errors.length ? ` · أخطاء ${tot.errors.length}` : ''}`, tot.errors.length ? 'err' : 'ok');
        })));
    };
    const m = modal([h('h3', null, 'استيراد مشتركين'), h('p', { class: 'hint' }, 'أعمدة الملف: الاسم، الجوال، الجنس (ذكر/أنثى)، رقم الباص. الصف الأول عناوين الأعمدة.'),
      h('div', { class: 'row' }, btnAct('اختيار ملف Excel / CSV', '', wrapFail(async () => {
        const f = await pickFile('.xlsx,.xls,.csv,.txt'); if (!f) return; const t = await readTable(f); if (t.length < 1) throw new Error('الملف فارغ');
        const hd = t[0].map(normHdr), iN = hdrFind(hd, 'اسم', 'name'), iP = hdrFind(hd, 'جوال', 'phone', 'mobile', 'هاتف', 'رقم'), iG = hdrFind(hd, 'جنس', 'gender', 'نوع'), iB = hdrFind(hd, 'باص', 'bus', 'حافلة');

async function viewResults() {

  const buses = [...new Map(rows.map(r => [r.bus_id ?? '-', r.bus_name])).entries()];
  const filtered = () => rows.filter(r => (!F.q || r.name.includes(F.q) || r.phone.includes(toLatinDigits(F.q).replace(/^0/, ''))) && (!F.g || r.gender === F.g) && (!F.bus || String(r.bus_id ?? '-') === F.bus) && (!F.st || r.status === F.st));
  const draw = () => {
    const f = filtered(); cnt.textContent = `${f.length} نتيجة`;
    mount(holder, tbl(['الترتيب', 'الاسم', 'الجوال', 'الجنس', 'الباص', 'النقاط', 'الصحيح', 'الزمن', 'الحالة'], f.length ? f.map(r => h('tr', null,
      h('td', { class: 'num bold' }, medal(r.rank)), h('td', { class: 'bold' }, r.name, r.is_test ? h('span', { class: 'chip bad', style: { marginInlineStart: '6px' } }, 'تجريبي') : null), h('td', { class: 'num' }, phoneShow(r.phone)),
      h('td', null, genderLabel(r.gender)), h('td', null, busLabel(r.bus_name)), h('td', { class: 'num bold' }, fmtN(r.points)), h('td', { class: 'num' }, r.correct), h('td', { class: 'num' }, fmtSec(r.total_ms)),
      h('td', null, h('span', { class: 'chip ' + (r.status === 'finished' ? 'ok' : 'gold') }, r.status === 'finished' ? 'أنهى' : 'جارٍ')))) : h('tr', null, h('td', { colspan: 9, class: 'center muted' }, 'لا توجد نتائج بعد')), 'print-area'));
  };
  const sel = (key, opts) => h('select', { class: 'input', onchange: e => { F[key] = e.target.value; draw(); } }, opts.map(([v, l]) => h('option', { value: v }, l)));
  const act = (label, cls, fn, confirm) => btnAct(label, cls, wrapFail(async () => { if (confirm && !(await confirmDlg(confirm))) return; await fn(); adminBoot(); }));
  const ctl = [];
  if (st === 'closed') ctl.push(act('نشر النتائج', 'gold', () => rpc('admin_publish_results', { p_publish: true }), { title: 'نشر النتائج؟', text: 'سيرى كل مشترك ترتيبه وقائمة المتصدرين ويراجع إجاباته مع الإجابات الصحيحة.' + (rows.some(r => r.is_test) ? ' ⚠️ يوجد محاولات تجريبية بين النتائج!' : ''), ok: 'نشر' }));

  body(
    h('div', { class: 'card noprint' }, h('div', { class: 'row sp' }, h('div', null, h('div', { class: 'muted small' }, 'الحالة'), stateChip(st)), h('div', { class: 'row' }, ctl,
      h('button', { class: 'btn gold', onclick: () => winnersChooser(rows) }, '🏆 إعلان الفائزين'),

        filtered().map(r => [r.rank, r.name, phoneShow(r.phone), genderLabel(r.gender), busLabel(r.bus_name), r.points, r.correct, +(r.total_ms / 1000).toFixed(1), r.status === 'finished' ? 'أنهى' : 'جارٍ'])))),
      h('button', { class: 'btn ghost', onclick: () => window.print() }, 'طباعة'))),
      st === 'open' ? h('p', { class: 'hint' }, 'المسابقة مفتوحة: الأرقام مباشرة وقد تتغير. يمكن نشر النتائج بعد إنهاء المسابقة.') : st === 'draft' || st === 'scheduled' ? h('p', { class: 'hint' }, 'المسابقة لم تبدأ بعد.') : null),
    h('div', { class: 'toolbar noprint' }, h('input', { class: 'input', placeholder: 'بحث بالاسم أو الجوال', oninput: e => { F.q = e.target.value.trim(); draw(); } }), sel('g', [['', 'الكل'], ['M', 'رجال'], ['F', 'نساء']]),
      sel('bus', [['', 'كل الباصات'], ...buses.map(([id, n]) => [String(id), busLabel(n)])]), sel('st', [['', 'كل الحالات'], ['finished', 'أنهى'], ['in_progress', 'جارٍ']]), cnt),

function winnersChooser(rows) {
  const real = rows.filter(r => !r.is_test && r.status === 'finished'), skipped = rows.length - real.length;
  const m = modal([h('h3', null, '🏆 إعلان الفائزين'), h('p', { class: 'muted' }, 'تُعرض الشاشة بملء الشاشة (مناسبة للعرض على شاشة كبيرة).' + (skipped ? ` يُستبعد ${skipped} من التجريبيين أو من لم ينهوا.` : '')),
    !real.length ? alertEl('warn', 'لا توجد نتائج منتهية لعرضها.') : null,
    h('button', { class: 'btn gold block', disabled: !real.length, onclick: () => { m.close(); showWinners(real, 'all'); } }, 'الفائزون مجتمعين (أول 3)'),
    h('button', { class: 'btn block mt', disabled: !real.length, onclick: () => { m.close(); showWinners(real, 'split'); } }, 'منفصلين: رجال ونساء (أول 3 لكل فئة)'),
    h('button', { class: 'btn ghost block mt', onclick: () => m.close() }, 'إلغاء')]);
}

function showWinners(real, mode) {
  const key = e => { if (e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); };
  const ordered = g => real.filter(r => !g || r.gender === g).sort((a, b) => a.rank - b.rank || b.points - a.points || a.total_ms - b.total_ms);
  const podium = top => {
    const slot = (p, i) => p ? h('div', { class: `slot s${i + 1}` }, h('div', { class: 'who' }, h('b', null, p.name), h('span', null, busLabel(p.bus_name)), h('div', { class: 'num' }, `${fmtN(p.points)} نقطة`)), h('div', { class: 'blk' }, String(i + 1))) : h('div', { class: 'slot' });
    return h('div', { class: 'podium' }, slot(top[1], 1), slot(top[0], 0), slot(top[2], 2));
  };
  const draw = () => {
    mount(ov, h('button', { class: 'x', onclick: close, title: 'إغلاق' }, '✕'), h('img', { src: CFG.logo, alt: '', style: { width: '90px', height: '90px', objectFit: 'contain', background: '#fff', borderRadius: '18px', padding: '6px', marginTop: '6px' } }),
      h('h1', null, 'الفائزون'), h('div', { class: 'cn' }, CFG.campaign_name + ' — مسابقة المعتمرين'),
      mode === 'all' ? podium(ordered(null).slice(0, 3))
        : [['M', 'الفائزون — الرجال'], ['F', 'الفائزات — النساء']].map(([g, t]) => h('div', { class: 'grp' }, h('h2', null, t), ordered(g).length ? podium(ordered(g).slice(0, 3)) : h('p', null, 'لا توجد نتائج'))),
      h('button', { class: 'btn gold mt', onclick: draw }, 'إعادة الحركة'));
  };
  const ov = h('div', { class: 'win' }); document.body.append(ov); document.addEventListener('keydown', key);
  ov.requestFullscreen?.().catch(() => {}); draw();
}

/* =====================================================================
   التوجيه والإقلاع
   ===================================================================== */
const ADMIN_VIEWS = { home: viewHome, questions: viewQuestions, participants: viewParticipants, buses: viewBuses, results: viewResults, settings: viewSettings };

let firstRoute = true;
async function route() {
  adminLeave();
  if (!firstRoute) { try { await loadConfig(); } catch { /* نكمل بالإعدادات السابقة */ } }   // تحديث الحالة عند كل تنقل

  if ((location.hash || '#/').startsWith('#/admin')) await adminBoot(); else await bootParticipant();

window.addEventListener('hashchange', route);

(async function main() {

    return;

  await route();
})();
